# Configuration for rpi/fastdet.sh (C fastdet detector, live Airspy).

RXID=0

THRESH_CARRIER=14s
THRESH_CORR=14s

# Carrier search window in FFT bins.  NOTE: bin indices scale with
# sample_rate/block_size — this value was originally computed for
# 2.4 Msps and MUST be retuned for the Airspy rate in use (see
# docs/user_guide.md, "carrier_window").
WINDOW=4-110

# Airspy tuning.  Mini: 3M or 6M; R2: 2.5M or 10M.
SAMPLE_RATE=6M
FREQ=433.83M

# R820T2 gain indices: LNA 0-14, Mixer 0-15, VGA 0-15.  0/0/0 is a
# deliberate "must be tuned per site" default — see the user guide's
# gain-tuning section for a starting point.
LNA_GAIN=5
MIXER_GAIN=5
VGA_GAIN=5

# Uncomment to feed DC up the antenna lead (verify the antenna chain is
# DC-isolated first!).  Uses fastdet's -B flag.
# BIAS_TEE=yes

SKIP=10000

WISDOM_FILE=/home/pi/fastdet.wisdom
TEMPLATE_FILE=template.tpl
# EXPORT_CARD=yes
