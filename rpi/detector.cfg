rxid:               0

# This is the legacy RTL-SDR pipeline config (rpi/detect.sh).  Without
# an explicit device_type the capture default (airspy_mini) applies and
# config validation rejects sample_rate 2.4M before capture starts.
device_type:        rtlsdr

sample_rate:        2.4M
chip_rate:          0.999707M

tuner_freq:         433.83M
tuner_gain:         30
capture_skip:       10000

block_size:         16384
block_history:      4920

carrier_window:     7 - 110
carrier_threshold:  14 * snr

corr_threshold:     14 * snr
template:           template.npy
