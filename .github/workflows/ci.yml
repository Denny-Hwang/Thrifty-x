name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,analysis]'
      - name: Run ruff (style + dead code)
        # The whole tree: package, tests, scripts/, diag/ and rpi/ helpers.
        run: ruff check .
      - name: Run mypy (static type check)
        run: mypy thriftyx/

  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported and a modern interpreter (README says 3.10+).
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,analysis]'
      - name: Run Python test suite
        run: pytest -q

  upstream-diff:
    # Thrifty-X forks swkrueger/Thrifty at the commit pinned in
    # scripts/upstream_diff.sh (and README).  The original sources are not
    # kept in the tree; this job fetches them and publishes how far each
    # ported module has drifted.  Informational: it cannot fail a build on
    # code changes, only on a broken fetch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diff thriftyx/ against upstream Thrifty
        run: scripts/upstream_diff.sh | tee -a "$GITHUB_STEP_SUMMARY"

  c-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fastcapture, fastdet]
    steps:
      - uses: actions/checkout@v4
      - name: Install C dependencies
        # libvolk-dev replaces libvolk2-dev on Ubuntu Noble (24.04); fall back
        # to the old name on older runners. The pkg-config interface
        # (`pkg-config volk`) is unchanged, so the CMake configuration works
        # either way.
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config libfftw3-dev libairspy-dev
          if apt-cache show libvolk-dev >/dev/null 2>&1; then
            sudo apt-get install -y libvolk-dev
          else
            sudo apt-get install -y libvolk2-dev
          fi
      - name: Build and install fastcapture (fastdet link dependency)
        # fastdet links the fastcapture static archive and includes its
        # headers, so fastcapture must be installed to the prefix first.
        if: matrix.target == 'fastdet'
        run: |
          cmake -S fastcapture -B build/fastcapture
          cmake --build build/fastcapture --config Release -j
          sudo cmake --install build/fastcapture --prefix /usr/local
      - name: Configure ${{ matrix.target }}
        run: cmake -S ${{ matrix.target }} -B build/${{ matrix.target }}
      - name: Build ${{ matrix.target }}
        run: cmake --build build/${{ matrix.target }} --config Release -j
      - name: C unit tests
        # Ring-buffer tests, including the exact-size put that used to
        # deadlock live Airspy capture.  test_circbuf aborts itself on a
        # hang, so a regression fails instead of stalling the runner.
        if: matrix.target == 'fastcapture'
        run: ctest --test-dir build/fastcapture --output-on-failure
      - name: Smoke-check binary output
        # Both CLIs use argp, so --help exits 0.  This step must FAIL
        # when the binary is missing or --help crashes — no `|| true`.
        run: |
          BIN=build/${{ matrix.target }}/${{ matrix.target == 'fastcapture' && 'fastcapture' || 'fastdet' }}
          test -x "$BIN"
          "$BIN" --help >/dev/null
      - name: Functional round-trip check (int16 v2 card format)
        # Guards the int16 file-reader layout: raw int16 -> card must
        # reproduce the input samples exactly, and the C card reader
        # must re-read fastcapture's own output byte-identically.
        # Stdlib-only Python, no package install needed.
        if: matrix.target == 'fastcapture'
        run: |
          python3 scripts/c_card_roundtrip_check.py \
            --binary build/fastcapture/fastcapture
