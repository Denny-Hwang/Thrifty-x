[project]
name = "thriftyx"
dynamic = ["version"]
description = "Airspy-based TDOA positioning system for wildlife tracking — fork of Thrifty by SW Krüger"
readme = "README.md"
requires-python = ">= 3.10"
license = {text = "GPL-3.0-only"}
authors = [
    {name = "Schalk Willem Krüger"},
    {name = "Sungjoo Hwang"},
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
]

[project.optional-dependencies]
fft = ["pyfftw>=0.13"]
analysis = ["matplotlib>=3.6"]
gui = ["matplotlib>=3.6", "PyQt5>=5.15"]
dev = ["pytest>=7.0", "pytest-cov", "mypy", "ruff>=0.16,<0.17"]
all = ["thriftyx[fft,analysis,gui,dev]"]

[project.scripts]
thriftyx = "thriftyx.cli:_main"
thrifty = "thriftyx.cli:_main"

[build-system]
requires = ["setuptools>=67"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["thriftyx*"]

[tool.setuptools.dynamic]
version = {attr = "thriftyx.__version__"}

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# Pin the rule set explicitly instead of relying on ruff's default
# `select`, which grows new rule groups across releases and would make
# the CI lint gate drift (ruff 0.16 added UP/I/LOG/... by default).
# E4/E7/E9/F is the historical default subset; E501 enforces the
# line-length above; B is bugbear (real bug patterns: mutable defaults,
# silent zip truncation, blind excepts, ...).  UP/I are candidates for
# a follow-up mechanical PR (~190 auto-fixable sites).
select = ["E4", "E7", "E9", "E501", "F", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

# Modules that have completed the type-hint rollout are held to the
# stricter bar so they cannot silently regress to untyped defs.
[[tool.mypy.overrides]]
module = [
    "thriftyx.hal.*",
    "thriftyx.config_validator",
    "thriftyx.setting_parsers",
]
disallow_untyped_defs = true
